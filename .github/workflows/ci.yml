name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一ブランチの古い実行はキャンセルする。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # mise.toml から Node / pnpm のバージョンを再現する（ローカルと同一）。
      - uses: jdx/mise-action@v4

      # ロックファイルとの差分を許さずインストール。
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # 脆弱性の検知・更新は Dependabot（security updates / alerts）に任せ、
  # CI では audit を行わない（.github/dependabot.yml 参照）。

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile

      # wrangler.jsonc の vars には本番 URL が入るため、E2E(localhost) 用に .dev.vars で上書きする。
      - run: |
          printf 'BETTER_AUTH_SECRET=ci-e2e-secret-value-at-least-32-bytes\nBETTER_AUTH_URL=http://localhost:8787\nWEB_ORIGIN=http://localhost:3000\nEMAIL_TEST_INBOX=1\n' > apps/api/.dev.vars

      # ローカル D1 にマイグレーションを適用（DB 依存の E2E に備える）。
      - run: pnpm --filter @warikan/api db:migrate:local

      # Chromium と必要な OS 依存を導入。
      - run: pnpm exec playwright install --with-deps chromium

      # webServer(api/web) は CI=true のため Playwright が起動・停止する。
      - run: pnpm e2e

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
