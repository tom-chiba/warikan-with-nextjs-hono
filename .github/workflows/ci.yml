name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一ブランチの古い実行はキャンセルする。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mise.toml から Node / pnpm のバージョンを再現する（ローカルと同一）。
      - uses: jdx/mise-action@v2

      # ロックファイルとの差分を許さずインストール。
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # 既知の脆弱性チェック（high 以上で失敗）。
      - run: pnpm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile

      # ローカル D1 にマイグレーションを適用（DB 依存の E2E に備える）。
      - run: pnpm --filter @warikan/api db:migrate:local

      # Chromium と必要な OS 依存を導入。
      - run: pnpm exec playwright install --with-deps chromium

      # webServer(api/web) は CI=true のため Playwright が起動・停止する。
      - run: pnpm e2e

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
