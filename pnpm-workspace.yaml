packages:
  - "apps/*"
  - "packages/*"

# ビルドスクリプト（postinstall 等）の実行を許可するパッケージ。既定は許可制のため
# 個別に承認する。以下はいずれも wrangler 由来の正規依存（バンドラ/ランタイム/画像処理）。
allowBuilds:
  esbuild: true # wrangler のバンドラ。ネイティブバイナリ取得に postinstall が必要
  sharp: true # miniflare のローカル Images 処理用ネイティブモジュール
  workerd: true # Cloudflare Workers ランタイム本体

# --- サプライチェーン対策（pnpm 11 の既定で有効なものは省略し、非デフォルトのみ記述）---
# 公開直後の（乗っ取られた可能性のある）バージョンを避けるため、
# 公開から指定分数が経過したバージョンのみインストールする。
minimumReleaseAge: 4320 # 3 days

# パッケージの信頼度が過去の版より下がった場合（provenance/信頼publisher の喪失 =
# アカウント乗っ取りの兆候）にインストールを失敗させる。既定は off のため明示有効化。
trustPolicy: no-downgrade

# trustPolicy の例外。正規性を確認済みのもののみ、理由を添えて列挙する。
trustPolicyExclude:
  # tinyexec: vitest の推移依存。tinylibs 製の正規パッケージで 1.2.2 は provenance 証明あり。
  # 「trusted-publisher → provenance」を no-downgrade が降格扱いする誤検知のため除外。
  - tinyexec
  # semver: @babel/core の推移依存。6.3.1 は npm CLI チームによる 6.x 系へのセキュリティ
  # バックポート（CVE-2022-25883 修正、公開者 lukekarrys を確認済み）。provenance 付きの
  # 7.5.x より後に公開されたため no-downgrade が降格扱いする誤検知のため除外。
  # 除外は監査済みの 6.3.1 のみに限定し、将来の別バージョンには no-downgrade を効かせ続ける。
  - semver@6.3.1
