packages:
  - "apps/*"
  - "packages/*"

# --- サプライチェーン対策（pnpm 11 の既定で有効なものは省略し、非デフォルトのみ記述）---
# 公開直後の（乗っ取られた可能性のある）バージョンを避けるため、
# 公開から指定分数が経過したバージョンのみインストールする。
minimumReleaseAge: 4320 # 3 days

# パッケージの信頼度が過去の版より下がった場合（provenance/信頼publisher の喪失 =
# アカウント乗っ取りの兆候）にインストールを失敗させる。既定は off のため明示有効化。
trustPolicy: no-downgrade
